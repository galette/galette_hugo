name: Accessibility Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium uniquement)
        run: npx playwright install --with-deps chromium

      # Hugo is started from Playwright via webServer in playwright.config.ts

      - name: Run accessibility tests
        run: npx playwright test
        # Do not fail immediately: we want all reports
        continue-on-error: true
        id: playwright

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (screenshots, traces, attachments)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      # Make CI fail **after** artifcats upload
      - name: Fail job if tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
