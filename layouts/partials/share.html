<div class="share-buttons">
  {{/* Bouton Web Share API - affiché uniquement si supporté */}}
  <button class="share-native" style="display:none;"
          data-title="{{ .Title }}"
          data-url="{{ .Permalink }}"
          title="{{ i18n "share.native" }}">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
    </svg>
    <span>{{ i18n "share.native" }}</span>
  </button>

  {{/* Fallback - liens classiques */}}
  <ul class="share-fallback">
    <li>
      <a href="https://mastodonshare.com/?text={{ .Title | urlquery }}&url={{ .Permalink | urlquery }}"
         target="_blank" rel="noopener" title="{{ i18n "share.mastodon" }}">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.268 5.313c-.35-2.578-2.617-4.61-5.304-5.004C17.51.242 15.792 0 11.813 0h-.03c-3.98 0-4.835.242-5.288.309C3.882.692 1.496 2.518.917 5.127.64 6.412.61 7.837.661 9.143c.074 1.874.088 3.745.26 5.611.118 1.24.325 2.47.62 3.68.55 2.237 2.777 4.098 4.96 4.857 2.336.792 4.849.923 7.256.38.265-.061.527-.132.786-.213.585-.184 1.27-.39 1.774-.753a.057.057 0 0 0 .023-.043v-1.809a.052.052 0 0 0-.02-.041.053.053 0 0 0-.046-.01 20.282 20.282 0 0 1-4.709.545c-2.73 0-3.463-1.284-3.674-1.818a5.593 5.593 0 0 1-.319-1.433.053.053 0 0 1 .066-.054c1.517.363 3.072.546 4.632.546.376 0 .75 0 1.125-.01 1.57-.044 3.224-.124 4.768-.422.038-.008.077-.015.11-.024 2.435-.464 4.753-1.92 4.989-5.604.008-.145.03-1.52.03-1.67.002-.512.167-3.63-.024-5.545zm-3.748 9.195h-2.561V8.29c0-1.309-.55-1.976-1.67-1.976-1.23 0-1.846.79-1.846 2.35v3.403h-2.546V8.663c0-1.56-.617-2.35-1.848-2.35-1.112 0-1.668.668-1.668 1.977v6.218H4.822V8.102c0-1.31.337-2.35 1.011-3.12.696-.77 1.608-1.164 2.74-1.164 1.311 0 2.302.5 2.962 1.498l.638 1.06.638-1.06c.66-.999 1.65-1.498 2.96-1.498 1.13 0 2.043.395 2.74 1.164.675.77 1.012 1.81 1.012 3.12z"/>
        </svg>
        <span class="sr-only">{{ i18n "share.mastodon" }}</span>
      </a>
    </li>
    <li>
      <a href="mailto:?subject={{ .Title | urlquery }}&body={{ .Title | urlquery }}%20-%20{{ .Permalink | urlquery }}"
         title="{{ i18n "share.email" }}">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <span class="sr-only">{{ i18n "share.email" }}</span>
      </a>
    </li>
  </ul>
</div>

<script>
(function() {
  if (navigator.share) {
    var btn = document.querySelector('.share-native');
    var fallback = document.querySelector('.share-fallback');
    if (btn && fallback) {
      btn.style.display = 'inline-flex';
      fallback.style.display = 'none';
      btn.addEventListener('click', function() {
        navigator.share({
          title: this.dataset.title,
          url: this.dataset.url
        }).catch(function() {});
      });
    }
  }
})();
</script>
