<!DOCTYPE html>
<html lang="{{ .Lang }}">
  {{ partial "head.html" . }}
  <body>
    {{ partial "header.html" . }}
    <main class="wrapper">
        <header>
            <div class="header-wrapper">
                <div class="header-title">
                    <h1>{{ .Title }}</h1>
                </div>
                {{ partial "langselector.html" . }}
            </div>
            {{ partial "galettebar.html" . }}
        </header>
        <section id="content" aria-label="Content">
            {{ block "main" . }}{{ end }}
        </section>
        {{ partial "sidebar.html" . }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
