{{ define "main" }}
  <h1>{{ i18n "pages.posts" }}</h1>
  {{ range .Paginator.Pages }}
    <article class="post-item">
      <div class="post-header">
        <time class="post-meta">{{ .Date.Format (i18n "global.date_format") }}</time>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      </div>
      <div class="post-excerpt">
        {{ .Content }}
        <p><a href="{{ .RelPermalink }}">{{ i18n "global.next" }}...</a></p>
      </div>
    </article>
    <hr>
  {{ end }}
  {{ partial "pagination.html" . }}
{{ end }}
