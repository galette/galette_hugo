baseURL = 'https://galette.eu/site/'
title = 'Galette'
defaultContentLanguage = 'en'
[params]
  email = 'contact@galette.eu'
  description = "Gestionnaire d'Adhérents en Ligne Extrêmement Tarabiscoté mais Tellement Efficace"
  author = 'Johan Cwiklinski'
  github_username = 'galette'
  mastodon_username = 'galette'
  mastodon_instance = 'framapiaf.org'
  # Paramètres Galette globaux pour un accès facile
  galette_last_release = '1.2.1'
  galette_stable_url = 'https://galette.eu/download/galette-1.2.1.tar.bz2'
  galette_nightly_url = 'https://galette.eu/download/galette-dev.tar.bz2'
  galette_doc_url = 'https://doc.galette.eu'
  galette_tracker_url = 'https://bugs.galette.eu/projects/galette/'
[pagination]
  pagerSize = 5

[server]
  port = 1313

[languages]
  [languages.fr]
    languageName = 'Français'
    weight = 1
    contentDir = 'content/fr'
    [languages.fr.menus]
      [[languages.fr.menus.main]]
        name = "Accueil"
        pageRef = "/"
        weight = 10
      [[languages.fr.menus.main]]
        name = "À propos"
        pageRef = "/about"
        weight = 20
      [[languages.fr.menus.main]]
        name = "Publications"
        pageRef = "/posts"
        weight = 30
      [[languages.fr.menus.main]]
        name = "Contribuer"
        pageRef = "/contribute"
        weight = 40
      [[languages.fr.menus.main]]
        name = "Contact"
        pageRef = "/contact"
        weight = 50
      [[languages.fr.menus.main]]
        name = "Démo"
        url = "https://demo.galette.eu/"
        weight = 60
  [languages.en]
    languageName = 'English'
    weight = 2
    contentDir = 'content/en'
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = "Home"
        pageRef = "/"
        weight = 10
      [[languages.en.menus.main]]
        name = "About"
        pageRef = "/about"
        weight = 20
      [[languages.en.menus.main]]
        name = "Posts"
        pageRef = "/posts"
        weight = 30
      [[languages.en.menus.main]]
        name = "Contribute"
        pageRef = "/contribute"
        weight = 40
      [[languages.en.menus.main]]
        name = "Contact"
        pageRef = "/contact"
        weight = 50
      [[languages.en.menus.main]]
        name = "Demo"
        url = "https://demo.galette.eu/"
        weight = 60
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
[permalinks]
  posts = '/post/:year/:month/:day/:slug/'

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime", ":default"]

[slugify]
  # Nettoyage des URLs (minuscules, sans accents) pour les nouveaux contenus
  strategies = ["ascii"]

[outputs]
  home = ['html', 'rss']
  section = ['html']
  taxonomy = ['html']
  term = ['html']

[outputFormats]
  [outputFormats.RSS]
    baseName = "feed"

[services]
  [services.rss]
    limit = 10
